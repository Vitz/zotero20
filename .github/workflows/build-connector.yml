name: Build Connector

on:
  push:
    branches: [main, fix/collection-key-ux]
    paths:
      - 'connector/**'
      - '.github/workflows/build-connector.yml'
  pull_request:
    paths:
      - 'connector/**'
      - '.github/workflows/build-connector.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup upstream and apply patches
        run: chmod +x setup.sh package-firefox-xpi.sh && ./setup.sh

      - name: Install dependencies
        working-directory: connector/upstream
        run: npm install

      - name: Build extension
        working-directory: connector/upstream
        run: ./build.sh

      - name: Verify Chrome and Firefox builds
        run: |
          test -f upstream/build/manifestv3/manifest.json
          test -f upstream/build/firefox/manifest.json
          ! grep -q 'BACKGROUND SCRIPTS' upstream/build/firefox/manifest.json

      - name: Package Firefox XPI
        run: ./package-firefox-xpi.sh

      - name: Upload Chrome build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zotero20-connector-chrome
          path: connector/upstream/build/manifestv3/
          retention-days: 30

      - name: Upload Firefox build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zotero20-connector-firefox
          path: |
            connector/upstream/build/firefox/
            connector/upstream/build/zotero20-connector-firefox.xpi
          retention-days: 30

      - name: Build summary
        run: |
          echo "### Zotero20 Connector build OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Chrome** (Load unpacked): \`connector/upstream/build/manifestv3\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Firefox** (temporary add-on): \`connector/upstream/build/firefox\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Firefox XPI**: \`connector/upstream/build/zotero20-connector-firefox.xpi\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Download artifacts **zotero20-connector-chrome** or **zotero20-connector-firefox** from this workflow run." >> "$GITHUB_STEP_SUMMARY"
