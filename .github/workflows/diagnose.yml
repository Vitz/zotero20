name: Diagnose remote

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Parse SSH target
        id: ssh
        run: |
          raw="${{ vars.DEPLOY_HOST }}"
          raw="${raw#http://}"
          raw="${raw#https://}"
          host="${raw%%:*}"
          port="${{ vars.PORT }}"
          if [ -z "$port" ]; then port="22"; fi
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "port=$port" >> "$GITHUB_OUTPUT"

      - name: Remote diagnostics
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.ssh.outputs.host }}
          port: ${{ steps.ssh.outputs.port }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -x
            echo "=== memory ==="
            free -m || true
            echo "=== docker stats (no-stream) ==="
            docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}' 2>/dev/null || true
            echo "=== health :8089 ==="
            curl -fsS http://127.0.0.1:8089/api/v1/health || true
            echo
            echo "=== docker compose ps ==="
            docker compose -p zotero20 ps 2>/dev/null || docker ps --filter name=zotero20
            echo "=== zotero desktop ping (container) ==="
            docker exec zotero20-zotero curl -fsS -D - --max-time 15 \
              http://127.0.0.1:23119/connector/ping 2>&1 | head -20 || echo "FAIL: zotero container ping"
            echo "=== connector ping via django (Firefox Connector) ==="
            curl -sS -D - --max-time 30 -H "X-API-Key: ${{ secrets.ZOTERO20_API_KEY }}" \
              http://127.0.0.1:8089/connector/ping 2>&1 | head -25 || echo "FAIL: django connector proxy"
            echo "=== document/execCommand reachability (expect 400/405, not 502/timeout) ==="
            curl -sS -w "\nHTTP %{http_code} time=%{time_total}s\n" --max-time 45 \
              -X POST -H "X-API-Key: ${{ secrets.ZOTERO20_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              http://127.0.0.1:8089/connector/document/execCommand 2>&1 | tail -5 \
              || echo "FAIL: document/execCommand proxy timeout"
            echo "=== django logs (tail 50) ==="
            docker compose -p zotero20 logs django --tail 50 2>/dev/null || docker logs zotero20-django --tail 50 2>/dev/null || true
            echo "=== collections (API key) ==="
            curl -fsS -H "X-API-Key: ${{ secrets.ZOTERO20_API_KEY }}" \
              http://127.0.0.1:8089/api/v1/collections || true
            echo
            echo "=== collections source check ==="
            curl -fsS -H "X-API-Key: ${{ secrets.ZOTERO20_API_KEY }}" \
              http://127.0.0.1:8089/api/v1/collections \
              | grep -q '"source": "web"' \
              && echo "OK: source=web (zotero.org)" \
              || echo "WARN: source!=web — sprawdź ZOTERO_WEB_API_KEY w stack/.env"
            echo
            echo "=== import DOI test (Hybrid 6GFRGT7A) ==="
            curl -sS -w "\nHTTP %{http_code}\n" \
              -H "X-API-Key: ${{ secrets.ZOTERO20_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{"doi":"10.1038/nature12373","collection_key":"6GFRGT7A"}' \
              http://127.0.0.1:8089/api/v1/import/doi || true
            echo
            echo "=== docx2pdf caddy ==="
            docker exec docx2pdf-caddy-1 cat /etc/caddy/Caddyfile | tail -15 2>/dev/null || true
            echo "=== caddy -> zotero (Host header) ==="
            docker exec docx2pdf-caddy-1 wget -qO- --header="Host: zotero.keyweb.pl" \
              http://172.17.0.1:8089/api/v1/health 2>&1 || true
