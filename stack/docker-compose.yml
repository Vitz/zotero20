# Stack produkcyjny zotero20 — osobne repo (tylko Docker Compose)
#
# Tunel CF (już masz):
#   zotero.keyweb.pl → http://172.16.2.10:8089
#
# Obrazy buduje repo Vitz/zotero20 (GitHub Actions → GHCR).
# To repo: tylko compose + .env + config — bezpieczne obok Moodle, Jellyfin itd.

name: zotero20

services:
  zotero:
    image: ${ZOTERO20_IMAGE_ZOTERO:?ustaw w .env}
    pull_policy: always
    container_name: zotero20-zotero
    restart: unless-stopped
    volumes:
      - zotero-profile:/home/zotero/Zotero
    ports:
      # 0.0.0.0 — Caddy docx2pdf łączy się przez 172.17.0.1:8089 (nie działa z bind 127.0.0.1)
      - "${ZOTERO20_HOST_PORT:-8089}:8000"
    shm_size: "512m"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:23119/connector/ping"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 180s

  django:
    image: ${ZOTERO20_IMAGE_DJANGO:?ustaw w .env}
    pull_policy: always
    container_name: zotero20-django
    restart: unless-stopped
    network_mode: "service:zotero"
    depends_on:
      zotero:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ZOTERO_URL: http://127.0.0.1:23119
      STUDIES_CONFIG: /config/studies.yaml
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-180}
      ZOTERO_PROXY_TIMEOUT: ${ZOTERO_PROXY_TIMEOUT:-60}
      ZOTERO_PROXY_DOCUMENT_TIMEOUT: ${ZOTERO_PROXY_DOCUMENT_TIMEOUT:-180}
    volumes:
      - ./config/studies.yaml:/config/studies.yaml:ro
      - django-data:/app/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: zotero20-cloudflared
    profiles: ["cloudflared"]
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARED_TUNNEL_TOKEN}
    network_mode: host
    depends_on:
      zotero:
        condition: service_healthy

volumes:
  zotero-profile:
    name: zotero20-zotero-profile
  django-data:
    name: zotero20-django-data
